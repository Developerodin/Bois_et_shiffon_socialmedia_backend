# Single-box proxy: the COMPLETE /etc/nginx/nginx.conf (events + http), mounted over the image's own. The stock config
# sends a `main` access log (full request line, query string included) to stdout; a conf.d fragment could only add a
# second log beside it, so this file replaces it and owns the only access log.
# /api/* -> Server, everything else -> website, as the ALB rules do in the scaled setup.
worker_processes auto;
pid /tmp/nginx.pid;
# The error log prints the full request line (query string included) on upstream errors, so only critical entries.
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # No $args: webhook secrets and OAuth codes travel in query strings and must not reach the logs.
    log_format noargs '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
    access_log /dev/stdout noargs;

    # Docker's resolver, so a recreated container's new address is picked up (a fixed upstream block resolves once).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Image and voice-clone uploads are 4 MB; story media goes straight to storage.
        client_max_body_size 5m;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        # Overwrite, never append: the Server reads the right-most entry and nginx is the one trusted hop.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat streams and agent runs take up to 300 s.
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;

        location /api/ {
            set $server_api http://server-api:3101;
            proxy_pass $server_api;
            # Streaming responses must not wait for a full buffer.
            proxy_buffering off;
        }

        location / {
            set $web http://web:3100;
            proxy_pass $web;
        }
    }
}
